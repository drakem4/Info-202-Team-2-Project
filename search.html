<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokédex | Search</title>
    <!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <header>
        <h1>Pokédex</h1>
        <p>Find information about your favorite Pokémon!</p>

    </header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Pokédex</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="search.html">Search</a>
                <a class="nav-link" href="contact.html">Contact</a>
                <a class="nav-link" href="group.html">Group Members</a>
            </div>
        </div>
    </nav>
    <main class="container mt-5">
        <h2>Search for a Pokémon</h2>
        <form id="searchForm">
            <label for="pokemonName" class="form-label">Enter Pokémon Name:</label>
            <input type="text" id="pokemonName" name="pokemonName" class="form-control" required>
            <button type="submit" class="btn btn-primary mt-3">Search</button>
        </form>
        <section id="pokemonInfo">
            <h2>Pokémon Information</h2>
            <p>Your search results will appear here.</p>
        </section>
    </main>
    <!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
